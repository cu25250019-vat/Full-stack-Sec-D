<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Student Events</title></head><body><h1>Student Events</h1><form><input name="q" value="{{ query }}" placeholder="Search by name"><button>Search</button></form><table border="1" cellpadding="8"><tr><th>Name</th><th>Event</th></tr>{% for student in students %}<tr><td>{{ student.name }}</td><td>{{ student.event }}</td></tr>{% empty %}<tr><td colspan="2">No students found.</td></tr>{% endfor %}</table></body></html>
