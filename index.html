<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Form</title><link rel="stylesheet" href="style.css"></head>
<body><main class="panel"><h1>Student Registration</h1><form id="registerForm">
<label>Full name<input id="name" required minlength="2"></label>
<label>Email<input id="email" type="email" required></label>
<label>Roll number<input id="roll" required></label>
<label>Course<select id="course" required><option value="">Choose course</option><option>CSE</option><option>IT</option><option>ECE</option></select></label>
<button>Register</button></form><p id="result" role="status"></p></main><script src="script.js"></script></body></html>
